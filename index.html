<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Ultimate Console FIXED</title>
    <style>
        :root { --neon: #0f0; --neon-bright: #5f5; --bg-dark: #000; }
        body { 
            background: #000; color: var(--neon); font-family: 'Courier New', monospace; 
            margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none;
        }
        #matrix-bg { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; }
        .console-body {
            background: linear-gradient(145deg, #333, #111); border: 4px solid #444; border-radius: 40px 40px 100px 40px;
            padding: 35px; box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 20px rgba(0,255,0,0.1);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .screen-frame {
            background: #000; border: 12px solid #222; outline: 2px solid #555; border-radius: 15px;
            display: flex; gap: 20px; padding: 20px; box-shadow: inset 0 0 40px #000, 0 0 15px rgba(0,255,0,0.2);
        }
        canvas { border: 2px solid #030; background: #000; }
        .side-info { display: flex; flex-direction: column; width: 110px; gap: 15px; }
        .box { background: #080808; border: 2px solid #222; padding: 10px; text-align: center; border-radius: 8px; }
        .label { font-size: 11px; color: #0a0; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--neon); }
        .value.top { color: #ff0; text-shadow: 0 0 10px #ff0; }
        .controls-area { margin-top: 45px; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); }
        .d-btn {
            background: #252525; border: 1px solid #444; color: #aaa;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 24px; box-shadow: 0 5px 0 #000; transition: 0.1s; user-select: none;
        }
        .d-btn:active { background: var(--neon); color: #000; transform: translateY(3px); box-shadow: 0 2px 0 #000; }
        .d-up { grid-column: 2; grid-row: 1; border-radius: 10px 10px 0 0; }
        .d-left { grid-column: 1; grid-row: 2; border-radius: 10px 0 0 10px; }
        .d-right { grid-column: 3; grid-row: 2; border-radius: 0 10px 10px 0; }
        .d-down { grid-column: 2; grid-row: 3; border-radius: 0 0 10px 10px; }
        .btn-rot {
            width: 85px; height: 85px; background: linear-gradient(145deg, #d00, #800);
            border: 4px solid #500; border-radius: 50%; color: #fff; font-weight: bold;
            font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #400; cursor: pointer;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 35px;
        }
        input { background: #000; border: 2px solid #0f0; color: #0f0; padding: 10px; width: 60px; text-align: center; margin: 15px; font-size: 24px; outline: none; }
        .start-btn { background: #0f0; color: #000; padding: 15px 40px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 5px; }
        .pause-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; color: #fff; background: rgba(0,100,0,0.7); padding: 10px 20px; border-radius: 5px; display: none; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>
<div class="console-body">
    <div id="overlay">
        <h1 style="color:#0f0">MATRIX ULTIMATE</h1>
        <div class="label">HIGH SCORE</div>
        <div id="highscore_overlay" class="value top" style="font-size: 30px; margin-bottom: 10px;">0</div>
        <div class="label">SET START LEVEL</div>
        <input type="number" id="startLevel" value="0" min="0" max="20">
        <button class="start-btn" onclick="startGame()">INITIALIZE</button>
    </div>
    <div class="pause-msg" id="pauseLabel">SYSTEM PAUSED</div>
    <div class="screen-frame">
        <canvas id="tetris" width="200" height="400"></canvas>
        <div class="side-info">
            <div class="box"><div class="label">NEXT</div><canvas id="next" width="80" height="80"></canvas></div>
            <div class="box"><div class="label">TOP</div><div id="highscore" class="value top">0</div></div>
            <div class="box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
            <div class="box"><div class="label">LEVEL</div><div id="level" class="value">0</div></div>
            <button onclick="togglePause()" style="background:#444; color:#fff; border:none; padding:8px; border-radius:4px; margin-top:auto; cursor:pointer;">PAUSE</button>
        </div>
    </div>
    <div class="controls-area">
        <div class="d-pad">
            <div class="d-btn d-up" onclick="playerHardDrop()">⚡</div>
            <div class="d-btn d-left" onclick="playerMove(-1)">◀</div>
            <div style="background:transparent"></div>
            <div class="d-btn d-right" onclick="playerMove(1)">▶</div>
            <div class="d-btn d-down" onclick="playerDrop()">▼</div>
        </div>
        <div class="action-btns"><div class="btn-rot" onclick="playerRotate()">ROTATE</div></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    context.scale(20, 20);
    nextCtx.scale(20, 20);

    const PIECES = {
        'I': [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]],
        'L': [[0,1,0],[0,1,0],[0,1,1]],
        'J': [[0,1,0],[0,1,0],[1,1,0]],
        'O': [[1,1],[1,1]],
        'Z': [[1,1,0],[0,1,1],[0,0,0]],
        'S': [[0,1,1],[1,1,0],[0,0,0]],
        'T': [[0,1,0],[1,1,1],[0,0,0]]
    };

    const REWARDS = { 1: 40, 2: 100, 3: 300, 4: 1200 };
    let arena = Array.from({length: 20}, () => Array(10).fill(0));
    let player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, lines: 0, level: 0 };
    let paused = false, dropCounter = 0, lastTime = 0;
    
    let animatingLines = [];
    let animationTimer = 0;
    const ANIM_TIME = 500; 

    let highScore = localStorage.getItem('matrixHighScore') || 0;
    updateUI();

    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        
        arena.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    if (animatingLines.includes(y)) {
                        context.fillStyle = (Math.floor(Date.now() / 80) % 2 === 0) ? '#fff' : '#0f0';
                    } else {
                        context.fillStyle = '#0f0';
                    }
                    context.fillRect(x, y, 0.9, 0.9);
                }
            });
        });

        if (animatingLines.length === 0 && player.matrix) {
            drawMatrix(player.matrix, player.pos, context);
        }
        
        nextCtx.fillStyle = '#000';
        nextCtx.fillRect(0, 0, 4, 4);
        if (player.next) {
            const offX = player.next.length === 4 ? 0 : 0.5;
            drawMatrix(player.next, {x: offX, y: 0.5}, nextCtx);
        }
    }

    function collide(fArena, fPlayer) {
        const [m, o] = [fPlayer.matrix, fPlayer.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (fArena[y + o.y] && fArena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function arenaSweep() {
        let rows = [];
        outer: for (let y = arena.length - 1; y >= 0; y--) {
            for (let x = 0; x < arena[y].length; x++) if (arena[y][x] === 0) continue outer;
            rows.push(y);
        }
        if (rows.length > 0) {
            animatingLines = rows;
            animationTimer = ANIM_TIME;
            return true;
        }
        return false;
    }

    function finishSweep() {
        animatingLines.sort((a,b) => a-b);
        animatingLines.forEach(y => {
            arena.splice(y, 1);
            arena.unshift(new Array(10).fill(0));
        });
        player.score += REWARDS[animatingLines.length] * (player.level + 1);
        player.lines += animatingLines.length;
        player.level = Math.floor(player.lines / 10);
        animatingLines = [];
        updateUI();
        playerReset();
    }

    function playerDrop() {
        if (paused || animatingLines.length > 0) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            player.matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val !== 0) arena[y + player.pos.y][x + player.pos.x] = val;
                });
            });
            if (!arenaSweep()) playerReset();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        if (paused || animatingLines.length > 0) return;
        while (!collide(arena, player)) player.pos.y++;
        player.pos.y--;
        player.matrix.forEach((row, y) => {
            row.forEach((val, x) => {
                if (val !== 0) arena[y + player.pos.y][x + player.pos.x] = val;
            });
        });
        if (!arenaSweep()) playerReset();
        dropCounter = 0;
    }

    function playerMove(dx) {
        if (paused || animatingLines.length > 0) return;
        player.pos.x += dx;
        if (collide(arena, player)) player.pos.x -= dx;
    }

    function playerRotate() {
        if (paused || animatingLines.length > 0) return;
        const m = player.matrix;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
        }
        m.forEach(row => row.reverse());
        if (collide(arena, player)) {
            player.pos.x += player.pos.x < 5 ? 1 : -1;
            if (collide(arena, player)) {
                m.forEach(row => row.reverse());
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[x][y], m[x][y]];
                }
                player.pos.x -= player.pos.x < 5 ? 1 : -1;
            }
        }
    }

    function playerReset() {
        const p = 'ILJOTSZ';
        if (!player.next) player.next = PIECES[p[p.length * Math.random() | 0]];
        player.matrix = JSON.parse(JSON.stringify(player.next));
        player.next = PIECES[p[p.length * Math.random() | 0]];
        player.pos.y = 0;
        player.pos.x = 3;
        if (collide(arena, player)) {
            if (player.score > highScore) {
                highScore = player.score;
                localStorage.setItem('matrixHighScore', highScore);
            }
            alert("MATRIX OVER. SCORE: " + player.score);
            arena.forEach(row => row.fill(0));
            document.getElementById('overlay').style.display = 'flex';
            updateUI();
        }
    }

    function update(time = 0) {
        const dt = time - lastTime;
        lastTime = time;
        if (!paused) {
            if (animatingLines.length > 0) {
                animationTimer -= dt;
                if (animationTimer <= 0) finishSweep();
            } else {
                dropCounter += dt;
                if (dropCounter > Math.max(80, 1000 - (player.level * 90))) playerDrop();
            }
            draw();
        }
        requestAnimationFrame(update);
    }

    function togglePause() { 
        paused = !paused; 
        document.getElementById('pauseLabel').style.display = paused ? 'block' : 'none';
    }

    function updateUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
        document.getElementById('highscore').innerText = highScore;
        document.getElementById('highscore_overlay').innerText = highScore;
    }

    function startGame() {
        player.level = parseInt(document.getElementById('startLevel').value) || 0;
        player.score = 0; player.lines = player.level * 10;
        arena.forEach(row => row.fill(0));
        document.getElementById('overlay').style.display = 'none';
        paused = false; playerReset(); update();
    }

    // MATRIX BG
    const bg = document.getElementById('matrix-bg');
    const bctx = bg.getContext('2d');
    function res() { bg.width = window.innerWidth; bg.height = window.innerHeight; }
    window.onresize = res; res();
    const drops = new Array(Math.floor(bg.width / 20)).fill(1);
    function drawBG() {
        bctx.fillStyle = 'rgba(0,0,0,0.1)';
        bctx.fillRect(0,0,bg.width,bg.height);
        bctx.fillStyle = '#0f0';
        for(let i=0; i<drops.length; i++) {
            bctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i*20, drops[i]*20);
            if(drops[i]*20 > bg.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawBG, 60);

    document.addEventListener('keydown', e => {
        if(e.keyCode===37) playerMove(-1);
        if(e.keyCode===39) playerMove(1);
        if(e.keyCode===40) playerDrop();
        if(e.keyCode===38) playerHardDrop();
        if(e.keyCode===32) playerRotate();
        if(e.keyCode===80) togglePause();
    });
</script>
</body>
</html>
